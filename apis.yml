name: Zet
description: >-
  Zet is a Bengaluru, India fintech that helps unserved and underserved Indians
  enter the formal credit system. Its core product is a fixed-deposit-backed
  (FD-backed) secured credit card starting at very low deposits, requiring no
  income proof or prior credit history, alongside credit-score monitoring and
  improvement tools, UPI payments, cashback rewards, a ZET Plus subscription
  tier, and a ZET Fixit credit-report error-resolution service. Backed by
  General Catalyst and Sequoia Capital, Zet operates as a consumer mobile app
  (iOS and Android) and, as of this enrichment pass, exposes no public developer
  platform, API, OpenAPI, or documented developer surface.
